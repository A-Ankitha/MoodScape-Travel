<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodScape Travel Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-sans antialiased" style="font-family: 'Poppins', sans-serif;">

    <!-- The lighter, animated background layer -->
    <div id="animation-canvas" class="fixed top-0 left-0 w-full h-full -z-10"></div>
    
    <!-- The main mobile frame -->
    <div id="mobile-frame" class="flex flex-col">
        
        <header id="header" class="relative p-4 pt-6 shadow-md z-10 text-center">
            <!-- New Chat Button -->
            <button id="new-chat-btn" title="Start New Chat">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                </svg>
            </button>
            
            <img src="icon.jpg" alt="MoodScape Logo" class="logo mx-auto mb-2"/>
            <h1 class="text-xl font-bold text-white">MoodScape Travel</h1>
            <p class="text-xs text-white/80">Your AI planner for trips that match your vibe</p>
        </header>

        <main class="flex-1 w-full flex flex-col overflow-hidden">
             <div id="chat-window" class="flex-1 space-y-4 p-4 overflow-y-auto"></div>
             <div id="typing-indicator" class="p-2 h-10 hidden items-center">
                 <div class="flex items-center space-x-1.5 p-3 bg-slate-200 rounded-full">
                     <div class="typing-dot w-2 h-2 bg-slate-500 rounded-full"></div>
                     <div class="typing-dot w-2 h-2 bg-slate-500 rounded-full"></div>
                     <div class="typing-dot w-2 h-2 bg-slate-500 rounded-full"></div>
                 </div>
             </div>
        </main>
        
        <footer class="bg-slate-100/80 backdrop-blur-sm shadow-inner pt-2">
            <div id="mood-selector" class="py-3">
                <p class="text-sm font-semibold text-slate-500 mb-3 text-center">How are you feeling today?</p>
                <div class="flex flex-wrap justify-center items-center gap-x-4 gap-y-2 px-4">
                    <button data-mood="adventurous" class="mood-choice">⛰️ Adventurous</button>
                    <button data-mood="relaxed" class="mood-choice">🏖️ Relaxed</button>
                    <button data-mood="romantic" class="mood-choice">❤️ Romantic</button>
                    <button data-mood="curious" class="mood-choice">🧐 Curious</button>
                    <button data-mood="budget-friendly" class="mood-choice">💰 Budget</button>
                </div>
            </div>
            <div class="p-3 border-t border-slate-200/90">
                <div id="input-container" class="flex items-center">
                    <input type="text" id="message-input" placeholder="Tell me your travel dreams...">
                    <button id="send-button" class="text-white font-bold rounded-full shadow-md transition-all duration-300">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.875L5.999 12zm0 0h7.5" />
                        </svg>
                    </button>
                </div>
            </div>
        </footer>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
